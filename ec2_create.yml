---
- hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: /home/boogeyman/ansible/project-3tier/ansible-env/bin/python

  tasks:
    - name: Create EC2 Instance
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        key_name: "ash-aws-keypairs"
        instance_type: t2.micro
        security_group: default
        region: ap-southeast-1
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"
        network:
          assign_public_ip: true
        image_id: "{{ item.image }}"
        tags:
          environment: "{{ item.name }}"
      loop:
        - { image: "ami-0e8ebb0ab254bb563", name: "manage-node1" }  # Amazon Linux
        - { image: "ami-01938df366ac2d954", name: "manage-node2" }  # Ubuntu
        - { image: "ami-01938df366ac2d954", name: "manage-node3" }  # Ubuntu
